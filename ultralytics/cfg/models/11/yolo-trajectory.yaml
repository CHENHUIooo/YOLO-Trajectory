# YOLO-Trajectory: YOLO11n-seg enhanced with DMSAB + CSP-MKFB + C3k2-PMSB
# Paper modules:
#   DMSAB      - Dilated Multi-branch Shared Attention Block (downsampling)
#   CSP_MKFB   - Cross Stage Partial Bottleneck with Multi-Kernel Fusion Block (backbone)
#   C3k2_PMSB  - C3k2 with Partial Multi-Scale Bottleneck (neck)

# Parameters
nc: 2 # number of classes (adjust to your dataset)
scales: # model compound scaling constants, i.e. 'model=yolo-trajectory.yaml' will call this yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, DMSAB, [128, True, 1]] # 1-P2/4
  - [-1, 2, CSP_MKFB, [256, 6, False, 0.25]] # 2
  - [-1, 1, DMSAB, [256, True, 1]] # 3-P3/8
  - [-1, 2, CSP_MKFB, [512, 4, True, 0.25]] # 4
  - [-1, 1, DMSAB, [512, True, 2]] # 5-P4/16
  - [-1, 2, CSP_MKFB, [512, 6, True, 0.5]] # 6
  - [-1, 1, DMSAB, [1024, True, 2]] # 7-P5/32
  - [-1, 2, CSP_MKFB, [1024, 4, True, 0.5]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2_PMSB, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2_PMSB, [256, False]] # 16 (P3/8-small)

  - [-1, 1, DMSAB, [256, True, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2_PMSB, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, DMSAB, [512, True, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2_PMSB, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Segment, [nc, 32, 256]] # Segment(P3, P4, P5)
